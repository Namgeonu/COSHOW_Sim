# ==========================================================================
# COSHOW 2단계 Nav2 파라미터 (LIMO 단독, 빈 지도, 차동구동)
# ==========================================================================
#
# 대상: ROS 2 Humble / Ubuntu 22.04.  (Jazzy 기준에서 이식 완료)
#
# Jazzy -> Humble 로 바뀐 부분. 아래 값은 모두 Humble 설치본에서 확인한 것:
#
# [1] enable_stamped_cmd_vel : Jazzy 전용 파라미터라 Humble 에는 없음 -> 삭제함.
#     Humble Nav2 는 일반 Twist 를 /cmd_vel 로 발행하고,
#     Humble DiffDriveController 는 use_stamped_vel: false 에서 일반 Twist 를 받으므로
#     "타입"은 저절로 맞는다. 다만 그때 구독하는 토픽 "이름"이 ~/cmd_vel 이 아니라
#     ~/cmd_vel_unstamped 로 바뀐다 -> limo_driver.launch.py 의 remap 이 이어준다.
#     (webots_ros2 공식 예제 turtlebot/tiago/epuck/husarion 과 동일한 배선)
#
# [2] progress_checker_plugin : Humble 은 단수형 문자열. (Jazzy 는 복수형 리스트)
#
# [3] behavior_server : Humble 은 costmap_topic / footprint_topic 을 하나씩만 받는다.
#     (Jazzy 의 local_costmap_topic / global_costmap_topic / local_frame 없음)
#     또 여기서의 global_frame 은 "복구 동작이 도는 기준 프레임"이라 map 이 아니라 odom.
#
# [4] 플러그인 등록 이름 : Humble 은 슬래시 표기 (nav2_behaviors/Spin,
#     nav2_navfn_planner/NavfnPlanner). Jazzy 는 콜론 표기.
#     단 nav2_controller::SimpleGoalChecker 계열과 dwb_core::DWBLocalPlanner 는
#     plugins.xml 에 name 속성이 없어 type 이 곧 이름 -> Humble 도 콜론 표기 그대로.
#
# ==========================================================================

# --- BT Navigator: navigate_to_pose action 서버를 여는 노드 ---
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

# --- Controller Server: 경로 추종 -> /cmd_vel 생성 ---
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"   # Humble: 단수형 문자열
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 6.28   # 도착 헤딩 무관 (맴돌기 방지, skid-steer 특성 고려)
      stateful: True
    # 공식 AgileX LIMO 와 동일: 순수 DWB (RotationShim 미사용).
    # GT odom 이 정확한 위치·방향을 주므로 DWB 만으로 제어.
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # --- 차동구동 속도 제한 (LIMO 실물 스펙: max 0.2 m/s 근처) ---
      min_vel_x: 0.0
      min_vel_y: 0.0          # 차동구동은 옆이동 0
      max_vel_x: 0.22
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_theta: -3.2
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.7
      # 차동구동: 제자리 회전 허용
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      # --- 공식 AgileX limo_ros2 navigation2.yaml 의 critic 가중치 (누락분 보충) ---
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# --- Global Costmap: 전역 지도 (빈 지도) ---
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.18        # LIMO 대략 반경
      resolution: 0.05
      track_unknown_space: false
      # 빈 지도: 외부 map 없이 고정 크기 costmap 사용.
      # rolling_window=true + 14m 창: 아레나(10x10) 어디서든 목표가 창 안에 들어오도록 (한 축 최대 이동 6.5m < 7m)
      rolling_window: true
      width: 14
      height: 14
      # static_layer 제거 (외부 /map 안 씀), scan 기반 obstacle + inflation 만 유지
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# --- Local Costmap: 지역 지도 (로봇 주변) ---
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.18
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# --- Planner Server: 전역 경로 계획 ---
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# --- Behavior Server: 복구 동작 (후진, 회전 등) ---
behavior_server:
  ros__parameters:
    # Humble 은 local/global 을 나누지 않고 costmap 하나만 받는다.
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    # Humble 의 global_frame 은 "복구 동작이 도는 기준 프레임" -> map 이 아니라 odom.
    # (launch 의 make_nav2_params 가 {ns}/odom 으로 치환해준다)
    global_frame: odom
    robot_base_frame: base_link
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # Humble pluginlib 등록 이름은 슬래시 표기 (Jazzy 는 :: 표기)
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
