# COSHOW 중앙 제어 BT 설정 (Webots 시뮬)
# 실행: python3 main.py --config scenarios/coshow/configs/coshow_sim.yaml
scenario:
  environment: scenarios.coshow

agent:
  namespaces: ""                    # 중앙 BT: 네임스페이스 없음. 로봇 이름은 XML 속성/블랙보드로 지정
  behavior_tree_xml: "default_bt.xml"

bt_runner:
  bt_tick_rate: 10.0
  bt_visualiser:
    enabled: True
    screen_width: 700
    screen_height: 520
    direction: Vertical
  profiling_mode: False

# ---------------- COSHOW 시나리오 파라미터 (bt_nodes.py가 읽음) ----------------
coshow:

  # Phase 1: 관측
  observe_drone: cf_a
  observe_point: {x: 0.0, y: 0.0, yaw: 1.57}     # limo_a 관측 지점 (P0)
  observe_z: 1.5
  mission_marker_ids: [11, 14]      # 참관자 마커 ID 범위 (포함)
  marker_id_offset: 10              # target_id = mission_id - 10
  confirm_frames: 3                 # 연속 검출 프레임 수 (확정 조건)

  # Phase 2/3: 탐색·구조   (고도: 이륙·탐색·호버 1.5, 복귀 이동만 return_z 1.0)
  searchers: [cf_b, cf_c, cf_d]
  seen_now_window: 0.5              # "지금 target을 보고 있다" 판정 창(초)
  recheck_timeout: 15.0             # 재검출 대기 타임아웃(초). 초과 시 P_N 그대로 확정
  rescue_sec: 10.0                  # limo_b 도착 후 구조 대기(초)
  hover_z_on_target: 1.5            # 재이동/호버 고도 (전 구간 고도 1.5 고정)

  drones:
    cf_a: {base: [-4.2, 0.6], return_z: 1.0}
    cf_b: {base: [-4.2, 0.2], return_z: 1.0}
    cf_c: {base: [-4.2, -0.2], return_z: 1.0}
    cf_d: {base: [-4.2, -0.6], return_z: 1.0}

  limos:
    limo_a: {base: [-3.5, -2.0], base_yaw: 0.0, pose_topic: /limo_a/odom}
    limo_b: {base: [-3.5, -3.0], base_yaw: 0.0, pose_topic: /limo_b/odom}

  search:
    stagger_sec: 3.0                # B→C→D 출격 시간차
    lane_spacing: 0.5
    wp_tol: 0.2
    lane_axis: y                    # 레인을 y 로 쪼개고 x축 왕복 (드론이 x=-4.2 대기 라인에서 진입)
    zones:                          # 6x6 잔디를 y축 기준 2m 폭 3구역으로 분할, 각 구역 4레인(폭 0.5)
      cf_b: {x: [-3.0, 3.0], y: [ 1.0,  3.0], z: 1.5}   # y+ (대기 y=0.2) 레인중앙 y: 1.25,1.75,2.25,2.75
      cf_c: {x: [-3.0, 3.0], y: [-1.0,  1.0], z: 1.5}   # 가운데(대기 y=-0.2) 레인중앙 y: -0.75,-0.25,0.25,0.75
      cf_d: {x: [-3.0, 3.0], y: [-3.0, -1.0], z: 1.5}   # y- (대기 y=-0.6) 레인중앙 y: -2.75,-2.25,-1.75,-1.25

  tolerances:
    drone_at: 0.15                  # 드론 도착 반경(m)
    drone_hold: 1.0                 # 반경 내 유지 시간(초)
    limo_at: 0.3                    # Nav2 SUCCEEDED 기록의 goal 과 노드 목표를 대조하는 허용치(m). pose 판정 아님
    airborne_z: 0.4                 # 이 이상이면 공중
    landed_z: 0.06                  # 이 이하이면 착륙

  # 명령 duration(초). go_to 는 현재 위치→목표 xy 거리로 short/long 구분
  durations:
    takeoff: 8.0
    land: 8.0
    goto_short: 5.0                 # 레인 이동 등 짧은 거리
    goto_long: 20.0                 # 그 외 긴 이동
    short_dist: 1.0                 # 이 거리(m) 이하이면 goto_short (레인 간격 0.5 포함)
  takeoff: {height: 1.5}
  goto:    {duration: 20.0}               # 이동 20초 고정 (거리 무관)
  led_topic_suffix: led             # stub: /{robot}/led (std_msgs/String)
